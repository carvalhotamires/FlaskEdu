{% extends 'base.html' %}

{% block title %}Chatbot | FlaskEdu{% endblock %}

{% block conteudo %}
<div class="chat-container">
    <h2>Faça sua Pergunta ao Chatbot</h2>

    {% if resposta %}
        <div class="resposta">
            <h3>Resposta do Gemini:</h3>
            <p>{{ resposta }}</p>
        </div>
    {% endif %}

    <form action="/responder" method="post" class="input-box">
        <input type="text" name="pergunta" placeholder="Digite sua pergunta..." required>
        <button type="submit" class="send-button">
            <img src="{{ url_for('static', filename='images/paper-plane.png') }}" alt="Enviar" style="width: 20px; height: 20px;">
        </button>
    </form>
</div>
{% endblock %}
