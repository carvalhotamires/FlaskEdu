{% extends 'base.html' %}

{% block title %}Glossário {% endblock %}

{% block conteudo %}

<style>
        table {
            width: 60%;
            border-collapse: collapse;
            margin: 20px auto;
            font-family: Arial, sans-serif;
            color: white
        }
        th, td {
            border: 1px solid #D5D5D5;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #1C1C1C;
        }
        caption {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
    </style>
    <link rel="stylesheet" href="header.css">

<table>
    <thead>
        <tr>
            <th>#</th>
            <th>Termo</th>
            <th>Definição</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for item in glossario %}
        <tr {% if editar_id is defined and loop.index0 == editar_id %} style="background-color: #333;" {% endif %}>
            <td>{{ loop.index }}</td>

            {% if editar_id is defined and loop.index0 == editar_id %}
            <form action="{{ url_for('editar_termo', termo_id=loop.index0) }}" method="POST">
                <td><input type="text" name="termo" value="{{ item[0] }}" required></td>
                <td><input type="text" name="definicao" value="{{ item[1] }}" required></td>
                <td>
                    <button type="submit" style="background-color: green; color: white;">💾 Salvar</button>
                </td>
            </form>
            {% else %}
                <td>{{ item[0] }}</td>
                <td>{{ item[1] }}</td>
                <td>
                    <a href="{{ url_for('editar_linha', termo_id=loop.index0) }}">
                        <button style="background-color: #2980b9; color: white;">✏️ Editar</button>
                    </a>
                    <form method="POST" action="{{ url_for('excluir_termo', termo_id=loop.index0) }}" style="display:inline;">
                        <button styletype="submit" style="background-color: #e74c3c; color: white;">🗑️ Excluir</button>
                    </form>
                </td>
            {% endif %}
        </tr>
        {% endfor %}
    </tbody>
</table>

<div style="text-align: center; margin-top: 30px;">
    <a href="{{ url_for('novo_termo') }}">
        <button style="background-color: purple; color: white;">➕ Adicionar Termo</button>
    </a>
</div>

{% endblock %}
