{% extends "base.html" %}
{% block conteudo %}
<h1>Adicionar Termo</h1>

<form action="{{ url_for('criar_termo') }}" method="post">
  <!-- Campo do termo -->
  <div class="mb-3">
    <label for="termo" class="form-label">Termo</label>
    <input type="text" class="form-control" id="termo" name="termo" required>
  </div>

  <!-- Campo da definição -->
  <div class="mb-3">
    <label for="definicao" class="form-label">Definição</label>
    <textarea class="form-control" id="definicao" name="definicao" rows="3" required></textarea>
  </div>

  <!-- Botão -->
  <button type="submit" class="btn btn-primary">Enviar</button>
</form>

{% endblock %}
